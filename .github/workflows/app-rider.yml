# L'app dei rider per Android (app-rider/): guscio su /rider con la posizione anche a schermo spento.
# A ogni modifica di app-rider/ (o a mano da «Actions») costruisce l'APK di prova e lo lascia fra gli
# «Artifacts» del giro. Si installa a mano sui telefoni dei rider: non va su Google Play.
name: App rider Android (prova)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app-rider/**", ".github/workflows/app-rider.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-rider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: a-mano-rider-apk
          path: app-rider/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
