# L'app nostra per Android, in prova: a ogni modifica di app-mobile/ (o a mano da «Actions»)
# costruisce l'APK di prova, non firmato per lo store, e lo lascia fra gli «Artifacts» del giro.
# Non pubblica niente su Google Play: la pubblicazione la decide Edoardo (regola del 24/10/2026).
name: App Android (prova)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app-mobile/**", ".github/workflows/app-android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: a-mano-a-mano-prova-apk
          path: app-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
